<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화음 3D 메인 샘플</title>
    <style>
      :root {
        --ink: #f8f5eb;
        --muted: rgba(248, 245, 235, 0.62);
        --cyan: #86c7c2;
        --gold: #d8ad58;
        --red: #c96657;
        --black: #000;
        --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
        --serif: "Iropke Batang", "Nanum Myeongjo", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--sans);
        background: var(--black);
        overflow: hidden;
      }

      a {
        color: inherit;
        font: inherit;
      }

      .sample-shell {
        position: relative;
        min-height: 100vh;
        background: #000;
        overflow: hidden;
      }

      .sample-shell::before {
        content: "";
        position: absolute;
        inset: -22%;
        background:
          radial-gradient(circle at 48% 36%, rgba(255, 255, 255, 0.16), transparent 18%),
          radial-gradient(circle at 28% 68%, rgba(134, 199, 194, 0.12), transparent 22%),
          radial-gradient(circle at 72% 58%, rgba(216, 173, 88, 0.12), transparent 20%),
          #000;
        filter: blur(4px);
        opacity: 0.78;
      }

      .hero-stage-wrap {
        position: relative;
        z-index: 2;
        width: 100vw;
        height: 100vh;
        perspective: 1500px;
        overflow: hidden;
      }

      .hero-stage {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 22%),
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.075), transparent 28%),
          #000;
        transform-style: preserve-3d;
        overflow: hidden;
      }

      .hero-stage::before {
        content: "";
        position: absolute;
        left: 11vw;
        right: 11vw;
        bottom: -7vh;
        height: 36vh;
        border: 1px solid rgba(255, 255, 255, 0.05);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        transform: rotateX(72deg) translateZ(-170px);
        transform-origin: bottom center;
        opacity: 0.48;
      }

      .hero-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 170px rgba(0, 0, 0, 0.92);
      }

      .scene {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: translateZ(0);
      }

      .world {
        position: absolute;
        inset: 0;
        z-index: 4;
        transform-style: preserve-3d;
        pointer-events: none;
        --spin-deg: 0deg;
      }

      .orbit-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(920px, 76vw);
        height: min(560px, 62vh);
        border: 1px dashed rgba(248, 245, 235, 0.18);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 44px rgba(134, 199, 194, 0.08),
          inset 0 0 64px rgba(216, 173, 88, 0.05);
        opacity: 0;
        animation: orbitRingFadeIn 1200ms ease 220ms forwards;
      }

      .orbit-ring::before,
      .orbit-ring::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .orbit-ring::before {
        inset: 9%;
        border: 1px solid rgba(134, 199, 194, 0.12);
      }

      .orbit-ring::after {
        left: 50%;
        top: 50%;
        width: 11px;
        height: 11px;
        background: rgba(248, 245, 235, 0.82);
        box-shadow: 0 0 28px rgba(248, 245, 235, 0.38);
        transform: translate(-50%, -50%);
      }

      .title-stack {
        position: absolute;
        left: 50%;
        top: 44%;
        width: min(900px, 86vw);
        transform: translate3d(-50%, -50%, 260px);
        transform-style: preserve-3d;
        text-align: center;
        filter: drop-shadow(0 34px 26px rgba(0, 0, 0, 0.74));
        z-index: 8;
        animation: titleSettle 1600ms cubic-bezier(0.18, 0.86, 0.16, 1) 120ms both;
      }

      .title-stack .subtitle {
        display: block;
        color: rgba(255, 255, 255, 0.82);
        margin-top: 16px;
        font-size: clamp(1rem, 1.35vw, 1.28rem);
        font-weight: 850;
        line-height: 1.55;
        letter-spacing: 0;
      }

      .title-stack .subtitle strong {
        display: block;
        color: var(--ink);
        font-size: clamp(1.24rem, 1.8vw, 1.7rem);
        font-weight: 950;
      }

      .title-stack .subtitle span {
        display: block;
        color: rgba(248, 245, 235, 0.72);
      }

      .title-stack .name {
        display: block;
        font-family: var(--sans);
        font-size: clamp(8.6rem, 13.5vw, 12.8rem);
        font-weight: 950;
        line-height: 0.82;
        text-shadow:
          0 5px 0 rgba(255, 255, 255, 0.08),
          0 42px 34px rgba(255, 255, 255, 0.12),
          0 0 76px rgba(134, 199, 194, 0.16);
      }

      .hashtag-row {
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        color: rgba(248, 245, 235, 0.72);
        font-size: clamp(0.88rem, 1.05vw, 1rem);
        font-weight: 850;
        line-height: 1.35;
      }

      .album-card {
        position: absolute;
        left: var(--o-left, 50%);
        top: var(--o-top, 50%);
        width: var(--o-size, 210px);
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: #171717;
        box-shadow:
          0 34px 64px rgba(0, 0, 0, 0.68),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
        transform-style: preserve-3d;
        transform: translate(-50%, -50%) scale(var(--o-scale, 1));
        opacity: 0;
        z-index: var(--o-z, 5);
        pointer-events: auto;
        user-select: none;
        -webkit-user-drag: none;
        cursor: grab;
        will-change: left, top, transform, opacity;
        animation:
          cardSlideIn 940ms cubic-bezier(0.16, 1, 0.3, 1) var(--o-delay, 0ms) forwards,
          cardFloat var(--o-dur, 7200ms) ease-in-out calc(var(--o-delay, 0ms) + 940ms) infinite;
      }

      .album-card img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .album-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, transparent 38%, rgba(0, 0, 0, 0.7)),
          linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 38%);
        pointer-events: none;
      }

      .album-card figcaption {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 14px;
        z-index: 2;
        display: grid;
        gap: 3px;
        text-shadow: 0 8px 16px rgba(0, 0, 0, 0.84);
      }

      .album-card figcaption span {
        color: rgba(248, 245, 235, 0.68);
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0;
      }

      .album-card figcaption strong {
        color: var(--ink);
        font-size: 1.08rem;
        font-weight: 950;
        line-height: 1.04;
      }

      .hero-stage.is-orbit-interactive {
        cursor: grab;
        user-select: none;
      }

      .hero-stage.is-orbit-dragging {
        cursor: grabbing;
      }

      .hero-stage.is-orbit-dragging .album-card {
        cursor: grabbing;
        animation-play-state: paused;
      }

      .start-link {
        position: fixed;
        right: 34px;
        bottom: 30px;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 8px;
        padding: 0 20px;
        color: #050505;
        background: var(--ink);
        text-decoration: none;
        font-weight: 900;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
      }

      @keyframes orbitRingFadeIn {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.92);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes cardSlideIn {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) translate(var(--o-slide-x, 0), var(--o-slide-y, 0)) scale(0.74);
          filter: blur(3px);
        }
        100% {
          opacity: var(--o-opacity, 0.94);
          transform: translate(-50%, -50%) scale(var(--o-scale, 1));
          filter: blur(0);
        }
      }

      @keyframes cardFloat {
        0%,
        100% {
          opacity: var(--o-opacity, 0.94);
          transform: translate(-50%, -50%) scale(var(--o-scale, 1)) translateY(0) rotate(0deg);
        }
        33% {
          transform: translate(-50%, -50%) scale(var(--o-scale, 1)) translateY(calc(-1 * var(--o-range, 8px))) rotate(0.7deg);
        }
        66% {
          transform: translate(-50%, -50%) scale(var(--o-scale, 1)) translateY(var(--o-range, 8px)) rotate(-0.7deg);
        }
      }

      @keyframes titleSettle {
        from {
          transform: translate3d(-50%, -50%, 260px) scale(0.94);
          opacity: 0;
        }
        to {
          transform: translate3d(-50%, -50%, 260px) scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .album-card,
        .orbit-ring,
        .title-stack {
          animation: none;
        }

        .album-card {
          opacity: var(--o-opacity, 0.94);
        }
      }
    </style>
  </head>
  <body>
    <div class="sample-shell">
      <main class="hero-stage-wrap">
        <section class="hero-stage" aria-label="화음 3D 메인 샘플">
          <div class="scene" aria-hidden="true">
            <div class="title-stack">
              <span class="name">화음</span>
              <span class="subtitle">
                <strong>음악과 소리를 조화롭게</strong>
                <span>그림으로 소리를 그리다</span>
              </span>
              <div class="hashtag-row">
                <span>#소리를그리다</span>
                <span>#음악과소리</span>
                <span>#그림BGM</span>
                <span>#화음</span>
              </div>
            </div>

            <div class="world">
              <div class="orbit-ring"></div>

              <figure
                class="album-card night"
                style="--o-size: 244px; --o-delay: 180ms; --o-dur: 7600ms; --o-range: 8px; --o-opacity: 0.96;"
              >
                <img src="../assets/hero/hero-night.webp" alt="" />
                <figcaption>
                  <span>#푸른밤</span>
                  <strong>조용한 선</strong>
                </figcaption>
              </figure>
              <figure
                class="album-card sun"
                style="--o-size: 190px; --o-delay: 260ms; --o-dur: 6800ms; --o-range: 7px; --o-opacity: 0.9;"
              >
                <img src="../assets/hero/hero-sun.webp" alt="" />
                <figcaption>
                  <span>#햇빛</span>
                  <strong>밝은 선율</strong>
                </figcaption>
              </figure>
              <figure
                class="album-card forest"
                style="--o-size: 226px; --o-delay: 340ms; --o-dur: 8000ms; --o-range: 9px; --o-opacity: 0.94;"
              >
                <img src="../assets/hero/hero-forest.webp" alt="" />
                <figcaption>
                  <span>#숲</span>
                  <strong>바람 노래</strong>
                </figcaption>
              </figure>
              <figure
                class="album-card dusk"
                style="--o-size: 204px; --o-delay: 420ms; --o-dur: 7000ms; --o-range: 8px; --o-opacity: 0.92;"
              >
                <img src="../assets/hero/hero-dusk.webp" alt="" />
                <figcaption>
                  <span>#노을</span>
                  <strong>붉은 리듬</strong>
                </figcaption>
              </figure>
              <figure
                class="album-card gugak"
                style="--o-size: 194px; --o-delay: 500ms; --o-dur: 7400ms; --o-range: 9px; --o-opacity: 0.92;"
              >
                <img src="../assets/hero/hero-gugak.webp" alt="" />
                <figcaption>
                  <span>#국악</span>
                  <strong>긴 숨</strong>
                </figcaption>
              </figure>
              <figure
                class="album-card playlist"
                style="--o-size: 214px; --o-delay: 580ms; --o-dur: 8200ms; --o-range: 7px; --o-opacity: 0.94;"
              >
                <img src="../assets/hero/hero-harmony.webp" alt="" />
                <figcaption>
                  <span>#모음</span>
                  <strong>나의 30초</strong>
                </figcaption>
              </figure>
            </div>
          </div>
        </section>
      </main>

      <a class="start-link" href="../index.html">시작하기</a>
    </div>
    <script>
      (() => {
        const heroStage = document.querySelector(".hero-stage");
        const world = document.querySelector(".world");
        const orbitRing = world?.querySelector(".orbit-ring");
        const cards = world ? Array.from(world.querySelectorAll(".album-card")) : [];
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        if (!heroStage || !world || !orbitRing || cards.length === 0) return;

        const IDLE_SPEED = 0.018;
        const DRAG_SPEED = 0.18;
        const BASE_FRAME_MS = 1000 / 60;
        const MAX_FRAME_SCALE = 2;
        const TRACK_SAMPLE_COUNT = 720;
        const TRACK_POWER = 3.1;
        const TRACK_SCALE_X = 1.08;
        const TRACK_SCALE_Y = 1.02;
        const TOP_TIGHTEN_PCT = 2.8;
        const DRAG_THRESHOLD_PX = 10;
        const DIRECTION_INTENT_PX = 4;
        const TANGENT_FALLBACK_RADIUS_PX = 56;

        let angle = -18;
        let direction = 1;
        let velocity = IDLE_SPEED;
        let targetVelocity = IDLE_SPEED;
        let rafId = null;
        let lastFrameTime = null;
        let activePointerId = null;
        let dragStartX = 0;
        let dragStartY = 0;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let isDragging = false;
        let trackSamples = [];

        function buildTrackSamples(radiusXPct, radiusYPct) {
          const samples = [];
          const exponent = 2 / TRACK_POWER;

          for (let sampleIndex = 0; sampleIndex <= TRACK_SAMPLE_COUNT; sampleIndex += 1) {
            const progress = sampleIndex / TRACK_SAMPLE_COUNT;
            const angleDeg = -90 + progress * 360;
            const radians = angleDeg * Math.PI / 180;
            const cosValue = Math.cos(radians);
            const sinValue = Math.sin(radians);
            const x = Math.sign(cosValue) * Math.pow(Math.abs(cosValue), exponent) * radiusXPct;
            const y = Math.sign(sinValue) * Math.pow(Math.abs(sinValue), exponent) * radiusYPct;
            const previous = samples[samples.length - 1];
            const length = previous ? previous.length + Math.hypot(x - previous.x, y - previous.y) : 0;

            samples.push({ progress, x, y, length });
          }

          return samples;
        }

        function getTrackPoint(progress) {
          if (!trackSamples.length) return null;

          const wrappedProgress = ((progress % 1) + 1) % 1;
          const totalLength = trackSamples[trackSamples.length - 1].length;
          const targetLength = wrappedProgress * totalLength;

          for (let index = 1; index < trackSamples.length; index += 1) {
            const previous = trackSamples[index - 1];
            const next = trackSamples[index];
            if (targetLength > next.length) continue;

            const segmentLength = next.length - previous.length || 1;
            const ratio = (targetLength - previous.length) / segmentLength;
            const x = previous.x + (next.x - previous.x) * ratio;
            const y = previous.y + (next.y - previous.y) * ratio;
            return { x, y, vectorRadians: Math.atan2(y, x) };
          }

          const last = trackSamples[trackSamples.length - 1];
          return { x: last.x, y: last.y, vectorRadians: Math.atan2(last.y, last.x) };
        }

        function syncOrbitLayout() {
          const worldWidth = world.clientWidth;
          const worldHeight = world.clientHeight;
          const ringWidth = orbitRing.offsetWidth;
          const ringHeight = orbitRing.offsetHeight;
          if (!worldWidth || !worldHeight || !ringWidth || !ringHeight) return;

          const radiusXPct = ((ringWidth / 2) * TRACK_SCALE_X / worldWidth) * 100;
          const radiusYPct = ((ringHeight / 2) * TRACK_SCALE_Y / worldHeight) * 100;
          const orbitOffset = (((angle % 360) + 360) % 360) / 360;
          const slideDistance = 118;

          trackSamples = buildTrackSamples(radiusXPct, radiusYPct);

          cards.forEach((card, index) => {
            const point = getTrackPoint(orbitOffset + index / cards.length);
            if (!point) return;

            const topWeight = Math.max(0, -point.y / radiusYPct);
            const frontWeight = (point.y + radiusYPct) / (radiusYPct * 2);
            const depth = Math.max(0, Math.min(1, frontWeight));
            const topLiftPct = Math.pow(topWeight, 2.15) * TOP_TIGHTEN_PCT;
            const leftPct = 50 + point.x;
            const topPct = 50 + point.y - topLiftPct;
            const slideX = Math.round(Math.cos(point.vectorRadians) * slideDistance);
            const slideY = Math.round(Math.sin(point.vectorRadians) * slideDistance);
            const scale = 0.86 + depth * 0.2;

            card.style.setProperty("--o-left", `${leftPct.toFixed(3)}%`);
            card.style.setProperty("--o-top", `${topPct.toFixed(3)}%`);
            card.style.setProperty("--o-slide-x", `${slideX}px`);
            card.style.setProperty("--o-slide-y", `${slideY}px`);
            card.style.setProperty("--o-scale", scale.toFixed(3));
            card.style.setProperty("--o-z", String(5 + Math.round(depth * 12)));
          });
        }

        function render() {
          world.style.setProperty("--spin-deg", `${angle}deg`);
          syncOrbitLayout();
        }

        function resolveDirectionFromPointerDelta(deltaX, deltaY, clientX, clientY) {
          const ringRect = orbitRing.getBoundingClientRect();
          const centerX = ringRect.left + ringRect.width / 2;
          const centerY = ringRect.top + ringRect.height / 2;
          const radialX = clientX - centerX;
          const radialY = clientY - centerY;
          const radialLength = Math.hypot(radialX, radialY);

          if (radialLength < TANGENT_FALLBACK_RADIUS_PX) {
            if (Math.abs(deltaX) < DIRECTION_INTENT_PX) return 0;
            return deltaX > 0 ? 1 : -1;
          }

          const normalizedRadialX = radialX / radialLength;
          const normalizedRadialY = radialY / radialLength;
          const clockwiseTangentX = -normalizedRadialY;
          const clockwiseTangentY = normalizedRadialX;
          const tangentIntent = deltaX * clockwiseTangentX + deltaY * clockwiseTangentY;

          if (Math.abs(tangentIntent) < DIRECTION_INTENT_PX) return 0;
          return tangentIntent > 0 ? 1 : -1;
        }

        function setOrbitDirection(nextDirection, speed = DRAG_SPEED) {
          direction = nextDirection >= 0 ? 1 : -1;
          targetVelocity = speed * direction;
        }

        function tick(timestamp) {
          if (lastFrameTime === null) lastFrameTime = timestamp;
          const elapsedMs = Math.max(0, timestamp - lastFrameTime);
          lastFrameTime = timestamp;
          const frameScale = Math.min(MAX_FRAME_SCALE, elapsedMs / BASE_FRAME_MS);

          velocity += (targetVelocity - velocity) * 0.1;
          angle += velocity * frameScale;
          render();
          rafId = requestAnimationFrame(tick);
        }

        function startOrbit() {
          if (reducedMotion.matches || rafId !== null) return;
          lastFrameTime = null;
          rafId = requestAnimationFrame(tick);
        }

        function stopOrbit() {
          if (rafId !== null) cancelAnimationFrame(rafId);
          rafId = null;
          lastFrameTime = null;
        }

        function handlePointerDown(event) {
          if (event.target?.closest("a, button, input, textarea, select")) return;

          activePointerId = event.pointerId;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          lastPointerX = event.clientX;
          lastPointerY = event.clientY;
          isDragging = true;
          heroStage.classList.add("is-orbit-dragging");

          try {
            heroStage.setPointerCapture(event.pointerId);
          } catch (_) {}
        }

        function handlePointerMove(event) {
          if (!isDragging || event.pointerId !== activePointerId) return;

          const stepDeltaX = event.clientX - lastPointerX;
          const stepDeltaY = event.clientY - lastPointerY;
          const deltaX = event.clientX - dragStartX;
          const deltaY = event.clientY - dragStartY;
          lastPointerX = event.clientX;
          lastPointerY = event.clientY;
          if (stepDeltaX === 0 && stepDeltaY === 0) return;

          const stepDirection = resolveDirectionFromPointerDelta(stepDeltaX, stepDeltaY, event.clientX, event.clientY);
          if (stepDirection !== 0 && stepDirection !== direction) {
            setOrbitDirection(stepDirection);
            dragStartX = event.clientX;
            dragStartY = event.clientY;
            startOrbit();
            return;
          }

          if (Math.hypot(deltaX, deltaY) < DRAG_THRESHOLD_PX) return;

          const dragDirection = resolveDirectionFromPointerDelta(deltaX, deltaY, event.clientX, event.clientY);
          if (dragDirection === 0) return;

          setOrbitDirection(dragDirection);
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          startOrbit();
        }

        function clearPointerState(event) {
          if (event && activePointerId !== null && event.pointerId !== activePointerId) return;

          isDragging = false;
          activePointerId = null;
          dragStartX = 0;
          dragStartY = 0;
          lastPointerX = 0;
          lastPointerY = 0;
          targetVelocity = IDLE_SPEED * direction;
          heroStage.classList.remove("is-orbit-dragging");
        }

        heroStage.classList.add("is-orbit-interactive");
        world.classList.add("is-ready");
        heroStage.addEventListener("pointerdown", handlePointerDown);
        heroStage.addEventListener("pointermove", handlePointerMove);
        heroStage.addEventListener("pointerup", clearPointerState);
        heroStage.addEventListener("pointercancel", clearPointerState);
        heroStage.addEventListener("lostpointercapture", clearPointerState);
        window.addEventListener("resize", render);

        reducedMotion.addEventListener?.("change", () => {
          if (reducedMotion.matches) {
            stopOrbit();
            render();
            return;
          }
          startOrbit();
        });

        render();
        startOrbit();
      })();
    </script>
  </body>
</html>
