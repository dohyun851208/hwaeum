<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화음 갤러리</title>
    <link rel="icon" type="image/webp" href="./assets/default-cover.webp" />
    <link rel="stylesheet" href="./styles.css?v=20260630-gallery-admin-menu" />
  </head>
  <body class="channel-body">
    <div class="channel-shell">
      <header class="channel-topbar">
        <div class="channel-menu-wrap">
          <button class="channel-menu-button" id="channelMenuBtn" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
          <div class="channel-menu-panel" id="channelMenu" hidden>
            <section class="channel-menu-section channel-menu-section--links" aria-label="이동">
              <button class="channel-menu-item" id="channelBackBtn" type="button">← 이전 화면</button>
              <a class="channel-menu-item" href="./studio.html">＋ 새 음악 만들기</a>
            </section>
            <section class="channel-menu-section" aria-labelledby="channelManageMenuTitle">
              <h2 id="channelManageMenuTitle">갤러리 관리</h2>
              <div class="channel-menu-actions">
                <button class="channel-menu-item" id="channelRenameBtn" type="button">이름 변경</button>
                <button class="channel-menu-item danger" id="channelDeleteBtn" type="button">화음 갤러리 삭제하기</button>
              </div>
            </section>
          </div>
        </div>

        <div class="channel-title-block">
          <h1 id="channelTitle">화음 갤러리<span class="channel-admin-flag" id="channelAdminFlag" hidden>관리자 모드</span></h1>
          <p id="channelCount">화음 갤러리를 불러옵니다.</p>
        </div>

        <div class="channel-top-actions">
          <p class="channel-status" id="channelStatus" aria-live="polite"></p>
          <section class="channel-gate" id="channelGate" hidden aria-label="갤러리 코드 입력">
            <form class="channel-gate-form" id="channelGateForm">
              <input id="channelGateInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="갤러리 코드" aria-label="갤러리 코드" />
              <button class="channel-open-button" type="submit">열기</button>
            </form>
          </section>
          <div class="channel-viewbar" id="channelViewbar" aria-label="갤러리 보기 방식">
            <div class="channel-view-tabs" role="group" aria-label="보기 방식">
              <button class="channel-view-tab active" id="channelShelfModeBtn" type="button" aria-pressed="true">한눈에 보기</button>
              <button class="channel-view-tab" id="channelFlowModeBtn" type="button" aria-pressed="false">커버플로우</button>
            </div>
            <div class="channel-flow-controls" aria-label="커버플로우 이동">
              <button class="channel-flow-nav" id="channelFlowPrevBtn" type="button" aria-label="이전 작품">‹</button>
              <button class="channel-flow-nav" id="channelFlowNextBtn" type="button" aria-label="다음 작품">›</button>
            </div>
          </div>
          <form class="channel-open-form" id="channelOpenForm">
            <label for="channelInput">현재 갤러리</label>
            <input id="channelInput" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="번호 (예 #107)" />
            <input id="channelCodeInput" class="channel-code-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="갤러리 코드" aria-label="갤러리 코드" />
            <button class="channel-open-button" type="submit">열기</button>
          </form>
        </div>
      </header>

      <main class="channel-library" id="channelLibrary">
        <div class="channel-shelves" id="channelShelves"></div>
        <div class="channel-empty" id="channelEmpty" hidden>
          <strong>아직 이 화음 갤러리에 음악이 없습니다.</strong>
          <span>스튜디오에서 완성한 음악을 화음 갤러리에 공유하면 여기에 모입니다.</span>
        </div>
      </main>
    </div>

    <div class="channel-viewer" id="channelViewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
      <button class="channel-viewer-close" id="viewerCloseBtn" type="button" aria-label="닫기">×</button>
      <div class="channel-viewer-panel">
        <figure class="channel-viewer-stage">
          <img class="channel-viewer-cover" id="viewerCover" alt="공유 음악 표지" />
          <button class="channel-viewer-play" id="viewerPlayBtn" type="button" aria-label="재생">▶</button>
        </figure>
        <section class="channel-viewer-info">
          <p class="channel-eyebrow">화음 갤러리 감상</p>
          <h2 id="viewerTitle">무제</h2>
          <p class="channel-viewer-meta" id="viewerMeta"></p>
          <audio class="channel-viewer-audio" id="viewerAudio" controls preload="auto"></audio>
          <p class="channel-viewer-text" id="viewerBackground" hidden></p>
          <p class="channel-viewer-text" id="viewerMelody" hidden></p>
          <p class="channel-viewer-tags" id="viewerTags" hidden></p>
          <div class="channel-viewer-actions">
            <button class="channel-action-button" id="viewerCopyBtn" type="button">링크 복사</button>
            <button class="channel-action-button danger" id="viewerDeleteBtn" type="button" hidden>삭제</button>
          </div>
        </section>
      </div>
    </div>

    <script src="./js/share-store.js?v=20260630-gallery-admin-menu" defer></script>
    <script src="./js/channel.js?v=20260630-gallery-admin-menu" defer></script>
  </body>
</html>
