<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화음</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #121416;
        --cream: #fff5dc;
        --gold: #ffe7a6;
        --gold-strong: #ffd56d;
        --teal: #3fd6d0;
        --red: #de6547;
        --page-bg: #101418;
        --sans: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
        --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        --hanja: "Malgun Gothic", "Microsoft JhengHei", "SimSun", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--cream);
        background: var(--page-bg);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        font: inherit;
      }

      .landing {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-height: 680px;
        overflow: hidden;
        isolation: isolate;
        background: var(--page-bg);
      }

      .final {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .final::before {
        content: "";
        position: absolute;
        inset: -4%;
        z-index: -3;
        background-image: url("assets/hero/intro-a-concept.webp");
        background-size: cover;
        background-position: center;
        filter: blur(1.8px) saturate(1.08) contrast(1.02);
        opacity: 0.94;
        transform: scale(1.04);
      }

      .final::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 229, 157, 0.35), transparent 25%),
          linear-gradient(180deg, rgba(7, 10, 14, 0.34), rgba(7, 10, 14, 0.76));
      }

      .flow-stage {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        animation: flowStageIn 700ms ease 6400ms forwards;
      }

      .flow-stage image {
        filter:
          saturate(1.08)
          drop-shadow(0 0 12px rgba(255, 232, 160, 0.42))
          drop-shadow(0 0 28px rgba(255, 198, 76, 0.22));
      }

      .flow-stage .flow-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: blur(0.35px);
      }

      .flow-stage .paint-line.ink {
        stroke: rgba(12, 10, 8, 0.025);
        stroke-width: 5;
      }

      .flow-stage .paint-line.teal {
        stroke: rgba(49, 139, 133, 0.025);
        stroke-width: 12;
      }

      .flow-stage .paint-line.gold {
        stroke: rgba(255, 211, 113, 0.045);
        stroke-width: 1.5;
      }

      .flow-stage .sound-line.gold {
        stroke: rgba(255, 218, 128, 0.06);
        stroke-width: 2;
      }

      .flow-stage .sound-line.teal {
        stroke: rgba(63, 214, 208, 0.025);
        stroke-width: 10;
      }

      .flow-stage .sound-line.dark {
        stroke: rgba(12, 10, 8, 0.02);
        stroke-width: 3;
      }

      .flow-stage .paint-flow {
        opacity: 1;
      }

      .flow-stage .sound-flow {
        opacity: 1;
      }

      .flow-stage .paint-flow > use:not(.flow-line),
      .flow-stage .sound-flow > use:not(.flow-line) {
        opacity: 1;
      }

      .flow-stage .note {
        fill: rgba(255, 238, 174, 0.98);
        stroke: rgba(24, 18, 8, 0.36);
        stroke-width: 1.8px;
        paint-order: stroke fill;
        font-family: "Segoe UI Symbol", "Arial Unicode MS", "Malgun Gothic", sans-serif;
        font-size: 68px;
        font-weight: 900;
        text-anchor: middle;
        dominant-baseline: middle;
        filter:
          drop-shadow(0 0 8px rgba(255, 240, 184, 0.78))
          drop-shadow(0 0 20px rgba(255, 202, 78, 0.48));
      }

      .flow-stage .note.large {
        font-size: 82px;
      }

      .flow-stage .note.small {
        font-size: 56px;
      }

      .title-stack {
        position: relative;
        z-index: 3;
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        animation: titleIn 940ms cubic-bezier(0.18, 0.86, 0.16, 1) 5420ms forwards;
      }

      .brand-title {
        margin: 0;
        color: var(--cream);
        font-family: var(--display);
        font-size: clamp(5.4rem, 7.3vw, 7.4rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: 0;
        text-shadow:
          0 4px 0 rgba(0, 0, 0, 0.32),
          0 28px 54px rgba(0, 0, 0, 0.5),
          0 0 34px rgba(255, 217, 128, 0.34);
      }

      .subtitle {
        margin: 0;
        color: var(--cream);
        font-size: clamp(1.18rem, 1.55vw, 1.55rem);
        font-weight: 900;
        line-height: 1.32;
        letter-spacing: 0;
        text-shadow: 0 12px 28px rgba(0, 0, 0, 0.46);
      }

      .enter-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 208px;
        margin-top: 2px;
        padding: 14px 24px 15px;
        border-radius: 8px;
        background: var(--gold);
        color: var(--ink);
        font-size: clamp(1.02rem, 1.16vw, 1.16rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        text-decoration: none;
        box-shadow:
          0 18px 38px rgba(0, 0, 0, 0.4),
          0 0 36px rgba(255, 214, 116, 0.34);
        pointer-events: auto;
        transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease;
      }

      .enter-cta:hover {
        background: #ffffff;
        transform: translateY(-2px);
        box-shadow:
          0 20px 42px rgba(0, 0, 0, 0.46),
          0 0 42px rgba(255, 233, 173, 0.42);
      }

      .enter-cta:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 5px;
      }

      .meaning-intro {
        position: absolute;
        inset: 0;
        z-index: 8;
        overflow: hidden;
        pointer-events: none;
        isolation: isolate;
        background: var(--page-bg);
        animation: introOut 620ms ease 5100ms forwards;
      }

      .meaning-intro::before {
        content: "";
        position: absolute;
        inset: -4%;
        z-index: -1;
        background:
          radial-gradient(circle at 31% 50%, rgba(222, 101, 71, 0.18), transparent 19%),
          radial-gradient(circle at 69% 51%, rgba(63, 214, 208, 0.16), transparent 20%),
          radial-gradient(circle at 50% 50%, rgba(255, 213, 109, 0.2), transparent 24%);
        filter: blur(12px);
      }

      .intro-section {
        --intro-left-width: 28.5vw;
        --intro-center-width: 43vw;
        --intro-right-width: 28.5vw;
        position: absolute;
        top: 0;
        bottom: 0;
        overflow: hidden;
        opacity: 0;
        background-image: url("assets/hero/intro-a-concept.webp");
        background-size: 100vw 100%;
        filter: saturate(1.08) contrast(1.04);
      }

      .intro-section::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(7, 10, 14, 0.06), rgba(7, 10, 14, 0.22));
      }

      .intro-section.paint {
        left: 0;
        width: var(--intro-left-width);
        background-position: left center;
        transform-origin: left center;
        animation: sideSectionIn 1050ms cubic-bezier(0.18, 0.86, 0.16, 1) 80ms forwards;
      }

      .intro-section.harmony {
        left: var(--intro-left-width);
        width: var(--intro-center-width);
        background-position: calc(0px - var(--intro-left-width)) center;
        transform-origin: center;
        animation: centerSectionIn 1150ms cubic-bezier(0.18, 0.86, 0.16, 1) 1680ms forwards;
      }

      .intro-section.sound {
        right: 0;
        width: var(--intro-right-width);
        background-position: right center;
        transform-origin: right center;
        animation: sideSectionIn 1050ms cubic-bezier(0.18, 0.86, 0.16, 1) 80ms forwards;
      }

      .intro-symbol {
        --start-x: 0vw;
        --mid-x: 0vw;
        --tilt: 0deg;
        --symbol-shadow: 0 28px 70px rgba(0, 0, 0, 0.52);
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 1;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 10px;
        width: clamp(170px, 17vw, 250px);
        min-height: clamp(150px, 15vw, 220px);
        opacity: 0;
        transform: translate(-50%, -50%) translateX(var(--start-x)) scale(0.68) rotate(var(--tilt));
        text-align: center;
        filter: drop-shadow(var(--symbol-shadow));
        animation: sideSymbolGather 4600ms cubic-bezier(0.18, 0.86, 0.16, 1) both;
      }

      .intro-symbol.paint {
        --start-x: -34vw;
        --mid-x: -10vw;
        --tilt: -5deg;
        animation-delay: 150ms;
      }

      .intro-symbol.sound {
        --start-x: 34vw;
        --mid-x: 10vw;
        --tilt: 5deg;
        animation-delay: 210ms;
      }

      .intro-symbol.harmony {
        width: clamp(250px, 25vw, 370px);
        min-height: clamp(220px, 22vw, 330px);
        transform: translate(-50%, -50%) scale(0.56);
        animation: harmonySymbolGather 3700ms cubic-bezier(0.18, 0.86, 0.16, 1) 1320ms both;
      }

      .meaning-object {
        position: absolute;
        inset: -15%;
        width: 130%;
        height: 130%;
        object-fit: contain;
        opacity: 0.96;
        transform-origin: 50% 50%;
      }

      .intro-symbol.harmony .meaning-object {
        inset: -8%;
        width: 116%;
        height: 116%;
        opacity: 1;
        animation-duration: 6200ms;
        animation-direction: reverse;
      }

      .meaning-glyph {
        position: relative;
        z-index: 1;
        display: block;
        color: var(--cream);
        font-family: var(--hanja);
        font-size: clamp(4.8rem, 8.2vw, 8.6rem);
        font-weight: 900;
        line-height: 0.9;
        text-shadow:
          0 3px 0 rgba(29, 21, 12, 0.48),
          0 18px 34px rgba(0, 0, 0, 0.58),
          0 0 24px rgba(255, 230, 156, 0.54);
        transform: translateY(-3px);
      }

      .intro-symbol.harmony .meaning-glyph {
        color: var(--gold-strong);
        font-size: clamp(7.2rem, 12vw, 12.5rem);
      }

      .meaning-label {
        position: relative;
        z-index: 1;
        min-width: 92px;
        padding: 7px 13px 8px;
        border: 1px solid rgba(255, 244, 214, 0.34);
        border-radius: 999px;
        background: rgba(10, 12, 14, 0.66);
        color: #fff6e2;
        font-size: clamp(0.9rem, 1.02vw, 1.04rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      @keyframes sideSectionIn {
        0% {
          opacity: 0;
          transform: scaleX(0.42);
          filter: blur(10px) saturate(1.08) contrast(1.04);
        }
        100% {
          opacity: 1;
          transform: scaleX(1);
          filter: blur(0) saturate(1.08) contrast(1.04);
        }
      }

      @keyframes centerSectionIn {
        0% {
          opacity: 0;
          transform: scaleX(0.18);
          filter: blur(12px) saturate(1.08) contrast(1.04);
        }
        34% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
          transform: scaleX(1);
          filter: blur(0) saturate(1.08) contrast(1.04);
        }
      }

      @keyframes sideSymbolGather {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) translateX(var(--start-x)) scale(0.62);
          filter: blur(8px) drop-shadow(var(--symbol-shadow));
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) translateX(var(--start-x)) scale(0.96);
          filter: blur(0) drop-shadow(var(--symbol-shadow));
        }
        46% {
          opacity: 1;
          transform: translate(-50%, -50%) translateX(var(--start-x)) scale(1.04);
        }
        68% {
          opacity: 1;
          transform: translate(-50%, -50%) translateX(var(--mid-x)) scale(0.92);
        }
        80% {
          opacity: 0.86;
          transform: translate(-50%, -50%) translateX(0) scale(0.56);
          filter: blur(0) drop-shadow(0 20px 52px rgba(255, 218, 128, 0.18));
        }
        88% {
          opacity: 0;
          transform: translate(-50%, -50%) translateX(0) scale(0.36);
          filter: blur(7px) drop-shadow(0 14px 34px rgba(255, 218, 128, 0.12));
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) translateX(0) scale(0.2);
          filter: blur(9px) drop-shadow(0 14px 34px rgba(255, 218, 128, 0.1));
        }
      }

      @keyframes harmonySymbolGather {
        0%,
        20% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.52);
          filter: blur(10px) drop-shadow(0 18px 44px rgba(0, 0, 0, 0.32));
        }
        42% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.06);
          filter: blur(0) drop-shadow(0 34px 86px rgba(255, 212, 117, 0.42));
        }
        76% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: blur(0) drop-shadow(0 34px 86px rgba(255, 212, 117, 0.38));
        }
        94% {
          opacity: 0.96;
          transform: translate(-50%, -50%) scale(0.68);
          filter: blur(0) drop-shadow(0 22px 54px rgba(255, 212, 117, 0.18));
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.25);
          filter: blur(9px) drop-shadow(0 14px 34px rgba(255, 212, 117, 0.12));
        }
      }

      @keyframes flowStageIn {
        to {
          opacity: 1;
        }
      }

      @keyframes introOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @keyframes titleIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-height: 780px) and (min-width: 769px) {
        .landing {
          min-height: 600px;
        }

        .brand-title {
          font-size: clamp(4.7rem, 6.2vw, 6rem);
        }

        .subtitle {
          font-size: 1.12rem;
        }

        .enter-cta {
          min-width: 188px;
          padding: 12px 22px 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .meaning-intro {
          display: none;
        }

        .title-stack,
        .flow-stage {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .flow-stage {
          display: none;
        }
      }
    </style>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const channel = params.get("shareChannel") || params.get("channel");
        if (!channel) return;
        const url = new URL("./channel.html", window.location.href);
        url.search = "?channel=" + encodeURIComponent(channel);
        url.hash = window.location.hash || "";
        window.location.replace(url.href);
      })();
    </script>
  </head>
