<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화음</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #121416;
        --cream: #fff5dc;
        --gold: #ffe7a6;
        --gold-strong: #ffd56d;
        --teal: #3fd6d0;
        --red: #de6547;
        --page-bg: #101418;
        --sans: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
        --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        --hanja: "Malgun Gothic", "Microsoft JhengHei", "SimSun", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--cream);
        background: var(--page-bg);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        font: inherit;
      }

      .landing {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-height: 680px;
        overflow: hidden;
        isolation: isolate;
        background: var(--page-bg);
      }

      .final {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .final::before {
        content: "";
        position: absolute;
        inset: -4%;
        z-index: -3;
        background-image: url("assets/hero/intro-a-background.webp");
        background-size: cover;
        background-position: center;
        filter: blur(1.4px) saturate(1.08) contrast(1.02);
        opacity: 0.94;
        transform: scale(1.04);
      }

      .final::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 229, 157, 0.35), transparent 25%),
          linear-gradient(180deg, rgba(7, 10, 14, 0.34), rgba(7, 10, 14, 0.76));
      }

      .final-object {
        position: absolute;
        z-index: -1;
        display: block;
        opacity: 0;
        pointer-events: none;
        animation: finalObjectIn 900ms ease 5360ms forwards;
      }

      .final-object img {
        width: 100%;
        height: auto;
        display: block;
        filter: saturate(1.04);
      }

      .final-object.paint {
        left: -5vw;
        top: 22vh;
        width: min(34vw, 520px);
        transform: rotate(-9deg);
      }

      .final-object.harmony {
        left: 50%;
        top: 48%;
        width: min(40vw, 620px);
        transform: translate(-50%, -50%);
      }

      .final-object.sound {
        right: -7vw;
        top: 23vh;
        width: min(40vw, 650px);
        transform: rotate(8deg);
      }

      .final-object.harmony img {
        opacity: 0.18;
        animation: slowSpin 34000ms linear infinite;
      }

      .final-object.paint img,
      .final-object.sound img {
        opacity: 0.28;
        animation: finalFloat 7600ms ease-in-out infinite;
      }

      .title-stack {
        position: relative;
        z-index: 3;
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        animation: titleIn 940ms cubic-bezier(0.18, 0.86, 0.16, 1) 5420ms forwards;
      }

      .brand-title {
        margin: 0;
        color: var(--cream);
        font-family: var(--display);
        font-size: clamp(5.4rem, 7.3vw, 7.4rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: 0;
        text-shadow:
          0 4px 0 rgba(0, 0, 0, 0.32),
          0 28px 54px rgba(0, 0, 0, 0.5),
          0 0 34px rgba(255, 217, 128, 0.34);
      }

      .subtitle {
        margin: 0;
        color: var(--cream);
        font-size: clamp(1.18rem, 1.55vw, 1.55rem);
        font-weight: 900;
        line-height: 1.32;
        letter-spacing: 0;
        text-shadow: 0 12px 28px rgba(0, 0, 0, 0.46);
      }

      .enter-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 208px;
        margin-top: 2px;
        padding: 14px 24px 15px;
        border-radius: 8px;
        background: var(--gold);
        color: var(--ink);
        font-size: clamp(1.02rem, 1.16vw, 1.16rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        text-decoration: none;
        box-shadow:
          0 18px 38px rgba(0, 0, 0, 0.4),
          0 0 36px rgba(255, 214, 116, 0.34);
        pointer-events: auto;
        transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease;
      }

      .enter-cta:hover {
        background: #ffffff;
        transform: translateY(-2px);
        box-shadow:
          0 20px 42px rgba(0, 0, 0, 0.46),
          0 0 42px rgba(255, 233, 173, 0.42);
      }

      .enter-cta:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 5px;
      }

      .meaning-intro {
        position: absolute;
        inset: 0;
        z-index: 8;
        overflow: hidden;
        pointer-events: none;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 229, 157, 0.28), transparent 27%),
          linear-gradient(180deg, rgba(7, 10, 14, 0.22), rgba(7, 10, 14, 0.66)),
          url("assets/hero/intro-a-background.webp") center / cover no-repeat,
          var(--page-bg);
        animation: introOut 620ms ease 5100ms forwards;
      }

      .meaning-intro::before {
        content: "";
        position: absolute;
        inset: -4%;
        z-index: -1;
        background:
          radial-gradient(circle at 31% 50%, rgba(222, 101, 71, 0.18), transparent 19%),
          radial-gradient(circle at 69% 51%, rgba(63, 214, 208, 0.16), transparent 20%),
          radial-gradient(circle at 50% 50%, rgba(255, 213, 109, 0.2), transparent 24%);
        filter: blur(12px);
      }

      .intro-symbol {
        --start-x: 0px;
        --mid-x: 0px;
        --tilt: 0deg;
        --symbol-shadow: 0 28px 70px rgba(0, 0, 0, 0.52);
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(270px, 25vw, 420px);
        aspect-ratio: 1;
        opacity: 0;
        transform: translate(-50%, -50%) translateX(var(--start-x)) scale(0.68) rotate(var(--tilt));
        text-align: center;
        filter: drop-shadow(var(--symbol-shadow));
        animation: sideSymbolGather 4600ms cubic-bezier(0.18, 0.86, 0.16, 1) both;
      }

      .intro-symbol.paint {
        --start-x: clamp(-570px, -34vw, -360px);
        --mid-x: clamp(-170px, -11vw, -110px);
        --tilt: -5deg;
        animation-delay: 150ms;
      }

      .intro-symbol.sound {
        --start-x: clamp(360px, 34vw, 570px);
        --mid-x: clamp(110px, 11vw, 170px);
        --tilt: 5deg;
        animation-delay: 210ms;
      }

      .intro-symbol.harmony {
        width: clamp(400px, 35vw, 620px);
        transform: translate(-50%, -50%) scale(0.56);
        animation: harmonySymbolGather 3700ms cubic-bezier(0.18, 0.86, 0.16, 1) 1320ms both;
      }

      .meaning-object {
        position: absolute;
        inset: -15%;
        width: 130%;
        height: 130%;
        object-fit: contain;
        opacity: 0.96;
        transform-origin: 50% 50%;
        animation: objectSpin 5100ms linear infinite;
      }

      .intro-symbol.harmony .meaning-object {
        inset: -8%;
        width: 116%;
        height: 116%;
        opacity: 1;
        animation-duration: 6200ms;
        animation-direction: reverse;
      }

      .meaning-glyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--cream);
        font-family: var(--hanja);
        font-size: clamp(5.6rem, 8.4vw, 8.8rem);
        font-weight: 900;
        line-height: 1;
        text-shadow:
          0 3px 0 rgba(29, 21, 12, 0.48),
          0 18px 34px rgba(0, 0, 0, 0.58),
          0 0 24px rgba(255, 230, 156, 0.54);
        transform: translateY(-3px);
      }

      .intro-symbol.harmony .meaning-glyph {
        color: var(--gold-strong);
        font-size: clamp(8.6rem, 13vw, 13.2rem);
      }

      .meaning-label {
        position: absolute;
        left: 50%;
        bottom: 16%;
        min-width: 92px;
        padding: 7px 13px 8px;
        border: 1px solid rgba(255, 244, 214, 0.34);
        border-radius: 999px;
        background: rgba(10, 12, 14, 0.66);
        color: #fff6e2;
        font-size: clamp(0.9rem, 1.02vw, 1.04rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.34);
        transform: translateX(-50%);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .intro-symbol.harmony .meaning-label {
        bottom: 17%;
      }

      @keyframes sideSymbolGather {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) translateX(var(--start-x)) scale(0.62) rotate(var(--tilt));
          filter: blur(8px) drop-shadow(var(--symbol-shadow));
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) translateX(var(--start-x)) scale(0.96) rotate(var(--tilt));
          filter: blur(0) drop-shadow(var(--symbol-shadow));
        }
        46% {
          opacity: 1;
          transform: translate(-50%, -50%) translateX(var(--start-x)) scale(1.04) rotate(var(--tilt));
        }
        68% {
          opacity: 1;
          transform: translate(-50%, -50%) translateX(var(--mid-x)) scale(0.92) rotate(0deg);
        }
        86% {
          opacity: 0.9;
          transform: translate(-50%, -50%) translateX(0) scale(0.54) rotate(0deg);
          filter: blur(0) drop-shadow(0 20px 52px rgba(255, 218, 128, 0.18));
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) translateX(0) scale(0.2) rotate(0deg);
          filter: blur(9px) drop-shadow(0 14px 34px rgba(255, 218, 128, 0.1));
        }
      }

      @keyframes harmonySymbolGather {
        0%,
        20% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.52);
          filter: blur(10px) drop-shadow(0 18px 44px rgba(0, 0, 0, 0.32));
        }
        42% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.06);
          filter: blur(0) drop-shadow(0 34px 86px rgba(255, 212, 117, 0.42));
        }
        76% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: blur(0) drop-shadow(0 34px 86px rgba(255, 212, 117, 0.38));
        }
        94% {
          opacity: 0.96;
          transform: translate(-50%, -50%) scale(0.68);
          filter: blur(0) drop-shadow(0 22px 54px rgba(255, 212, 117, 0.18));
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.25);
          filter: blur(9px) drop-shadow(0 14px 34px rgba(255, 212, 117, 0.12));
        }
      }

      @keyframes objectSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes finalFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-12px) rotate(1.6deg);
        }
      }

      @keyframes slowSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes finalObjectIn {
        to {
          opacity: 1;
        }
      }

      @keyframes introOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @keyframes titleIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-height: 780px) and (min-width: 769px) {
        .landing {
          min-height: 600px;
        }

        .brand-title {
          font-size: clamp(4.7rem, 6.2vw, 6rem);
        }

        .subtitle {
          font-size: 1.12rem;
        }

        .enter-cta {
          min-width: 188px;
          padding: 12px 22px 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .meaning-intro {
          display: none;
        }

        .title-stack,
        .final-object {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .final-object.harmony {
          transform: translate(-50%, -50%);
        }

        .meaning-object,
        .final-object img {
          animation: none;
        }
      }
    </style>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const channel = params.get("shareChannel") || params.get("channel");
        if (!channel) return;
        const url = new URL("./channel.html", window.location.href);
        url.search = "?channel=" + encodeURIComponent(channel);
        url.hash = window.location.hash || "";
        window.location.replace(url.href);
      })();
    </script>
  </head>
  <body>
    <main class="landing" aria-label="화음 메인">
      <section class="final" aria-label="화음 첫 화면">
        <div class="final-object paint" aria-hidden="true">
          <img src="assets/hero/intro-a-paint-cutout.webp" alt="" />
        </div>
        <div class="final-object harmony" aria-hidden="true">
          <img src="assets/hero/intro-a-harmony-cutout.webp" alt="" />
        </div>
        <div class="final-object sound" aria-hidden="true">
          <img src="assets/hero/intro-a-sound-cutout.webp" alt="" />
        </div>

        <div class="title-stack">
          <h1 class="brand-title">화음</h1>
          <p class="subtitle">그림과 소리를 조화롭게<br />나만의 BGM 만들기</p>
          <a class="enter-cta" href="studio.html">입장하기</a>
        </div>
      </section>

      <section class="meaning-intro" aria-hidden="true">
        <div class="intro-symbol paint">
          <img class="meaning-object" src="assets/hero/intro-a-paint-cutout.webp" alt="" />
          <span class="meaning-glyph">畵</span>
          <span class="meaning-label">그림 화</span>
        </div>
        <div class="intro-symbol harmony">
          <img class="meaning-object" src="assets/hero/intro-a-harmony-cutout.webp" alt="" />
          <span class="meaning-glyph">和</span>
          <span class="meaning-label">조화로울 화</span>
        </div>
        <div class="intro-symbol sound">
          <img class="meaning-object" src="assets/hero/intro-a-sound-cutout.webp" alt="" />
          <span class="meaning-glyph">音</span>
          <span class="meaning-label">소리 음</span>
        </div>
      </section>
    </main>
  </body>
</html>
