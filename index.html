<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101d20" />
    <meta name="description" content="그림에 선율을 더하다. 내 그림 위에 선을 그어 나만의 30초 음악을 만드는 화음 스튜디오." />
    <title>화음 — 그림에 선율을 더하다</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101d20'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='43' fill='%23e2c58d'%3E畵%3C/text%3E%3C/svg%3E" />
    <link rel="preload" as="font" href="assets/fonts/landing-title.ttf" type="font/ttf" crossorigin />
    <link rel="preload" as="image" href="assets/hero/melody-landscape.webp" />
    <link rel="preload" as="image" href="assets/hero/gold-notes.webp" />
    <style>
      @font-face {
        font-family: "Hwaeum Hand";
        src: url("assets/fonts/landing-title.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --paper: #f3eee0;
        --gold: #e2c58d;
        --ink: #101d20;
        --seal: #b8432f;
        --sans: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        --brush: "Hwaeum Hand", "Batang", cursive;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); word-break: keep-all; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }
      a, button { -webkit-tap-highlight-color: transparent; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 7px; }
      .landing { position: relative; min-height: 640px; height: 100svh; overflow: hidden; isolation: isolate; background: var(--ink); }
      .scene { position: absolute; inset: 0; z-index: -2; pointer-events: none; }
      .scene > * { position: absolute; inset: 0; width: 100%; height: 100%; }
      .painting { object-fit: cover; user-select: none; }
      /* The landscape starts almost unseen; each note brings up its ink (수묵), and the finished song colours it all (담채). */
      .painting-ink { filter: grayscale(1) brightness(.8); }
      .has-intro .painting-ink { opacity: calc(var(--ink-in, 0) * .08); }
      /* The finished painting is a touch more vivid; filtered only once shown, so loading skips that work. */
      html:not(.has-intro) .painting-color, .is-lit .painting-color { filter: saturate(1.15) contrast(1.05); }
      .has-intro .painting-color { opacity: 0; }
      .is-lit .painting-color { opacity: 1; }
      .is-lit .painting-ink, .is-lit .paint-layer { visibility: hidden; }
      /* Failsafe: even if the intro is paused early or its script stops, the finished page appears. */
      .has-intro:not(.is-live) .painting-color { animation: settle 1s 12s forwards; }
      .has-intro .seal { animation: settle-seal .4s 12s forwards; }
      @keyframes settle { to { opacity: 1; visibility: visible; translate: 0 0; filter: none; -webkit-mask-image: none; mask-image: none; } }
      @keyframes settle-seal { to { opacity: .94; transform: rotate(-1.5deg); } }
      .atmosphere { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, transparent 74%, rgba(8, 17, 20, .6)); }
      .hero-copy { --title-size: clamp(100px, 8.3vw, 130px); position: absolute; top: 32%; left: 50%; width: min(640px, 55vw); transform: translate(-50%, -50%); text-align: center; }
      .has-intro .hero-copy > :not(.seal) {
        opacity: var(--intro-opacity, 0);
        visibility: var(--intro-visibility, hidden);
        translate: 0 var(--intro-lift, 10px);
        animation: settle .6s 12s forwards;
      }
      .has-intro h1 {
        filter: blur(var(--intro-blur, 5px));
        mask-image: linear-gradient(105deg, #000 calc(var(--intro-wipe, 0%) - 26%), transparent var(--intro-wipe, 0%));
      }
      h1 { margin: 0 0 30px; font: 400 var(--title-size)/1.12 var(--brush); letter-spacing: .045em; color: #f4ead2; }
      /* 畵音 seal: the name's two characters, stamped beside the title like an artist's seal. */
      .seal {
        position: absolute; left: 50%; top: 0; overflow: visible; pointer-events: none;
        width: calc(var(--title-size) * .34); height: calc(var(--title-size) * .635);
        margin: calc(var(--title-size) * .36) 0 0 calc(var(--title-size) * 1.1);
        transform: rotate(-1.5deg);
      }
      .has-intro .seal { opacity: var(--seal-opacity, 0); transform: rotate(-1.5deg) scale(var(--seal-scale, 1.3)); }
      .enter-cta {
        display: inline-flex; align-items: center; justify-content: center; gap: 24px; padding: 12px 30px 14px;
        border: 1px solid rgba(229, 218, 186, .35); border-radius: 2px; background: rgba(16, 29, 32, .22); color: #f1e4c5;
        font: 400 15px/1.5 var(--sans); letter-spacing: .07em;
        transition: background .2s, border-color .2s, transform .2s;
      }
      .enter-cta svg { width: 19px; height: 19px; transition: transform .2s; }
      .enter-cta:hover { background: rgba(226, 197, 141, .09); border-color: rgba(229, 218, 186, .7); transform: translateY(-2px); }
      .enter-cta:hover svg { transform: translateX(3px); }
      .page-footer { position: absolute; right: 4.3%; bottom: 28px; }
      .motion-controls { display: flex; gap: 10px; align-items: center; }
      .motion-controls[hidden] { display: none; }
      .motion-button { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 9px; background: none; border: 1px solid #c8c3a52e; border-radius: 50%; color: #c2c9bc; cursor: pointer; transition: color .2s, border-color .2s; }
      .motion-button:hover, #sound-toggle[aria-pressed="true"] { color: var(--gold); border-color: #e2c58d66; }
      .motion-button svg { width: 14px; height: 14px; flex: 0 0 auto; }
      .motion-button .play-icon, #motion-toggle[aria-pressed="true"] .pause-icon { display: none; }
      #motion-toggle[aria-pressed="true"] .play-icon { display: block; }
      #sound-toggle .sound-on-icon, #sound-toggle[aria-pressed="true"] .sound-off-icon { display: none; }
      #sound-toggle[aria-pressed="true"] .sound-on-icon { display: block; }
      /* While the intro plays silently, the sound switch breathes softly so it can be found without words. */
      #sound-toggle.is-hinting { color: #e8d4a6; border-color: #e2c58d70; animation: sound-hint 2.4s ease-in-out infinite; }
      @keyframes sound-hint { 50% { box-shadow: 0 0 0 5px rgba(226, 197, 141, .1), 0 0 18px rgba(226, 197, 141, .28); } }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
      /* Desktop classroom screens, including short laptop windows. */
      @media (max-height: 760px) {
        .hero-copy { --title-size: 104px; }
        .page-footer { bottom: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
        #sound-toggle.is-hinting { animation: none; }
      }
    </style>
    <script>
      (() => {
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("has-intro");
        const params = new URLSearchParams(window.location.search);
        const channel = params.get("shareChannel") || params.get("channel");
        if (!channel) return;
        const url = new URL("./channel.html", window.location.href);
        url.search = "?channel=" + encodeURIComponent(channel);
        url.hash = window.location.hash || "";
        window.location.replace(url.href);
      })();
    </script>

    <script>
      (() => {
        "use strict";
        const root = document.documentElement;
        const landing = document.querySelector(".landing");
        const canvas = document.querySelector(".melody-layer");
        const ctx = canvas.getContext("2d");
        if (!ctx) { root.classList.remove("has-intro"); return; }

        // 선율 표: [계이름, 길이(8분음표 몇 개)]. 그림 위 선의 높낮이와 대금 소리가 모두 이 표를 따릅니다.
        // 쓸 수 있는 계이름: 낮은솔 · 낮은라 · 도 · 레 · 미 · 솔 · 라 · 높은도 · 높은레 · 높은미
        const MELODY = [
          ["레", 2], ["솔", 1], ["라", 3], ["솔", 1], ["미", 1], ["도", 3],
          ["레", 1], ["미", 1], ["솔", 2], ["미", 1], ["라", 4],
        ];
        const PITCH = { 낮은솔: 55, 낮은라: 57, 도: 60, 레: 62, 미: 64, 솔: 67, 라: 69, 높은도: 72, 높은레: 74, 높은미: 76 };
        const AXIS = [55, 57, 60, 62, 64, 67, 69, 72, 74, 76];
        // Studio daegeum takes: file, calibrated Hz (js/sample-calibration.js) and the measured per-note gain
        // (NOTE_MELODY_OUTPUT_GAINS.daegeum in js/audio-engine.js), so the landing sounds like the studio.
        const DAEGEUM = "sound/선율-국악(국립국악원)/관/daegeum/daegeum_";
        const TAKES = {
          55: ["As3", 237.893, 1.791], 57: ["As3", 237.893, 1.791], 60: ["Cs4", 271.158, 2.048], 62: ["D4", 293.598, 1.601],
          64: ["E4", 323.057, .941], 67: ["G4", 401.773, .736], 69: ["A4", 437.096, .715], 72: ["Cs5", 543.673, .953],
          74: ["D5", 583.022, .735], 76: ["E5", 645.988, 1.072],
        };
        // Note sprites inside gold-notes.webp, with the notehead centre as anchor.
        const SPRITES = {
          eighth: { x: 8, w: 87, hx: 27.6, hy: 104 },
          quarter: { x: 103, w: 55, hx: 27.4, hy: 104.2 },
          half: { x: 166, w: 59, hx: 29.8, hy: 103.2 },
          sixteenth: { x: 233, w: 90, hx: 27.5, hy: 104.3 },
          tilt: { x: 331, w: 101, hx: 30.3, hy: 102.7 },
        };
        // Geometry in melody-landscape.webp pixels (1536 x 1024): the line rides the dark band above the ridges.
        const ART_W = 1536, ART_H = 1024;
        const LINE = { x0: 228, x1: 1332, base: 660, gap: 24 };
        const MOON = { x: 1366, y: 600 };
        const DRAW_AT = 450, DRAW_MS = 4400, COPY_AT = 5050, SEAL_AT = 6450, STILL_AT = 8200;
        const GLINT_FIRST = 3200, GLINT_EVERY = 12000;
        const copyParts = Array.from(document.querySelectorAll(".hero-copy > h1, .enter-cta"));
        const copyTiming = [[0, 2100], [900, 1600]];
        const seal = document.querySelector(".seal");
        const inkImage = document.querySelector(".painting-ink");
        const colorImage = document.querySelector(".painting-color");
        const paintCanvas = document.querySelector(".paint-layer");
        const pctx = paintCanvas.getContext("2d");
        const toggle = document.getElementById("motion-toggle");
        const soundButton = document.getElementById("sound-toggle");
        const preference = matchMedia("(prefers-reduced-motion: reduce)");
        const clamp = v => Math.max(0, Math.min(1, v));
        const ease = v => .5 - Math.cos(Math.PI * clamp(v)) / 2;
        const easeOut = v => 1 - Math.pow(1 - clamp(v), 3);
        const noise = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
        const seconds = DRAW_MS / 1000;

        const total = MELODY.reduce((sum, [, len]) => sum + len, 0);
        let beat = 0;
        const notes = MELODY.map(([name, len]) => {
          const midi = PITCH[name] || PITCH.미;
          const span = (LINE.x1 - LINE.x0) * len / total;
          const note = {
            len, midi,
            start: beat / total * seconds,
            end: (beat + len) / total * seconds,
            x: LINE.x0 + (LINE.x1 - LINE.x0) * beat / total + Math.min(22, span * .42),
            y: LINE.base - (AXIS.indexOf(midi) - 2) * LINE.gap,
          };
          beat += len;
          return note;
        });

        // A hand following the melody: x keeps time, y glides toward each pitch like a soft spring
        // (short notes are sung through, long ones settle and waver like 농현), and quick leaps thin the line.
        const stroke = (() => {
          const points = [];
          const dt = 1 / 500, omega = Math.PI * 2 * 2.3, zeta = .84;
          let y = notes[0].y + 12, v = 0, i = 0, lastX = -Infinity;
          for (let step = 0; ; step++) {
            const t = Math.min(seconds, step * dt);
            while (i < notes.length - 1 && t >= notes[i].end) i++;
            const note = notes[i], next = notes[i + 1];
            const target = next && t > note.end - .085 ? next.y : note.y;
            v += (omega * omega * (target - y) - 2 * zeta * omega * v) * dt;
            y += v * dt;
            let wave = 0;
            if (note.len >= 3) {
              const held = t - (note.start + (note.end - note.start) * .35);
              if (held > 0) wave = Math.sin(held * Math.PI * 2 * 4.6) * Math.min(1, held / .35) * (next ? 2 : 3.2);
            }
            const x = LINE.x0 + (LINE.x1 - LINE.x0) * t / seconds;
            if (x - lastX >= 1.6 || t >= seconds) {
              let w = 3.1 * (1.08 - .4 * Math.min(1, Math.abs(v) / 320)) * (1 - .1 * t / seconds);
              w *= (.35 + .65 * ease(t / .09)) * (.2 + .8 * (1 - ease((t - seconds + .2) / .2)));
              const drift = Math.sin(t * Math.PI * 2 / 1.3 + .4) * 1.4 + Math.sin(t * 15.7) * .22;
              points.push({ t, x, y: y + wave + drift, w });
              lastX = x;
            }
            if (t >= seconds) break;
          }
          points.forEach((p, k) => {
            const a = points[Math.max(0, k - 1)], b = points[Math.min(points.length - 1, k + 1)];
            const length = Math.hypot(b.x - a.x, b.y - a.y) || 1;
            p.nx = -(b.y - a.y) / length;
            p.ny = (b.x - a.x) / length;
          });
          return points;
        })();
        const dust = Array.from({ length: 42 }, (_, n) => ({
          born: (n + noise(n) * .8) / 42 * seconds,
          dx: (noise(n + 7) - .5) * 6, dy: (noise(n + 3) - .5) * 6,
          vx: -10 - noise(n + 11) * 22, vy: -6 + noise(n + 5) * 26,
          life: .9 + noise(n + 2) * .9, size: .6 + noise(n + 9) * 1.1,
        }));
        // Each note drops its colour where it is sung, a watercolour bloom running down into the hills.
        // Long notes spread further; the first washes the plum branch and the last the moon.
        const blooms = notes.map((note, n) => {

              gain.gain.setTargetAtTime(0, now, .05);
              source.stop(now + .3);
            } catch (error) { /* already stopped */ }
          });
        }
        // Runs every frame: once sound is on, the drawing under way is played from where its line has reached.
        function syncSound() {
          if (!soundOn || !audio || paused || playedEpoch === drawEpoch) return;
          playedEpoch = drawEpoch;
          const position = (lineTime - DRAW_AT) / 1000;
          if (position > seconds - .15) return;
          silence();
          playMelody(audio, position);
        }
        const drawingNow = () => lineTime < DRAW_AT + DRAW_MS + 100;
        function redraw() {
          lineTime = DRAW_AT - 250; drawEpoch++; wasBusy = true; lastPaint = -Infinity; schedule();
        }
        // With motion off the line stays put and only the melody plays.
        function playStill() {
          loadTakes().then(ready => { if (soundOn) { silence(); playMelody(ready, -.05); } }).catch(() => {});
        }
        function enableSound() {
          soundOn = true; userMuted = false; playedEpoch = -1; updateSound();
          const sound = ensureContext();
          if (sound && sound.state !== "running") sound.resume().catch(() => {});
          loadTakes().catch(() => { soundOn = false; updateSound(); });
          // Joining a melody already under way would only let the ending be heard: start the painting over instead.
          if (paused) playStill(); else if (!drawingNow() || lineTime > DRAW_AT + 600) redraw();
        }
        function disableSound() {
          soundOn = false; userMuted = true; silence(); updateSound();
        }
        function updateHint() {
          soundButton.classList.toggle("is-hinting", !soundOn && !userMuted && !paused && introTime < 20000);
        }
        function updateSound() {
          const label = soundOn ? "소리 끄기" : "소리 켜기";
          soundButton.setAttribute("aria-pressed", String(soundOn));
          soundButton.querySelector("span").textContent = label;
          soundButton.title = label;
          updateHint();
        }

        function updateControl() {
          const label = paused ? "움직임 켜기" : "움직임 멈추기";
          toggle.setAttribute("aria-pressed", String(paused));
          toggle.querySelector("span").textContent = label;
          toggle.title = label;
          updateHint();
        }
        function busy() {
          return introTime < STILL_AT + 100 || lineTime < DRAW_AT + DRAW_MS + 2600 || glintNow() !== null;
        }
        function tick(now) {
          frame = 0;
          if (paused || document.hidden || !ready) { previous = null; return; }
          if (previous !== null) {
            const step = Math.min(100, Math.max(0, now - previous));
            introTime += step; lineTime += step;
          }
          previous = now;
          syncSound();
          updateHint();
          if (now - lastPaint >= 32) {
            const active = busy();
            if (active || wasBusy) render();
            wasBusy = active;
            lastPaint = now;
          }
          frame = requestAnimationFrame(tick);
        }
        function schedule() { if (!frame && !paused && !document.hidden && ready) frame = requestAnimationFrame(tick); }
        function stopFrame() { cancelAnimationFrame(frame); frame = 0; previous = null; }
        function hush() { stopFrame(); silence(); playedEpoch = -1; }
        toggle.addEventListener("click", () => {
          paused = !paused; updateControl();
          if (paused) hush(); else { wasBusy = true; schedule(); }
        });
        soundButton.addEventListener("click", () => { if (soundOn) disableSound(); else enableSound(); });
        // Tapping the picture plays it: the first tap brings in the sound, later taps draw the melody again.
        landing.addEventListener("pointerdown", event => {
          if (event.button !== 0 || event.target.closest("a, button")) return;
          if (!soundOn && !userMuted) enableSound();
          else if (paused) { if (soundOn) playStill(); }
          else if (!drawingNow()) redraw();
        });
        document.addEventListener("visibilitychange", () => { if (document.hidden) hush(); else schedule(); });
        preference.addEventListener("change", () => {
          hush(); paused = preference.matches;
          if (paused) introTime = lineTime = STILL_AT;
          render(); updateControl(); schedule();
        });
        window.addEventListener("resize", resize);
        window.addEventListener("pagehide", hush);
        window.addEventListener("pageshow", schedule);
        sheet.addEventListener("load", () => { if (paused) render(); });
        colorImage.addEventListener("load", () => { if (!artReady.ink) { prepareArt(); render(); } });
        updateControl(); updateSound(); resize();

        let loadingTimer;
        function start() {
          if (ready) return;
          ready = true;
          root.classList.add("is-live");
          prepareArt();
          clearTimeout(loadingTimer);
          document.querySelector(".motion-controls").hidden = false;
          render(); schedule();
          // Fetch the takes now; where autoplay is allowed the intro is heard from its first note.
          loadTakes().catch(() => {});
        }
        if (colorImage.complete && colorImage.naturalWidth) start();
        else {
          colorImage.addEventListener("load", start, { once: true });
          colorImage.addEventListener("error", start, { once: true });
          loadingTimer = setTimeout(start, 1500);
        }
      })();
    </script>
  </body>
</html>
